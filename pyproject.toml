[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "weightspec"
dynamic = ["version"]
description = "The open standard and runtime for weight-space programming: small, typed, verifiable patches that edit neural-network weights directly."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The WeightSpec Authors" }]
keywords = [
  "weight-space programming", "model editing", "mechanistic interpretability",
  "llm", "safetensors", "transformers", "neural networks", "patch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# The core (format, ops, directions, verification) depends only on numpy and pydantic.
dependencies = ["numpy>=1.24", "pydantic>=2.5"]

[project.optional-dependencies]
tokenizers = ["tokenizers>=0.15"]
torch = ["torch>=2.1"]
hub = ["huggingface_hub>=0.20"]
mcp = ["mcp>=2.3"]
probe = ["torch>=2.1", "transformers>=4.56"]
anthropic = ["anthropic>=2.6"]
openai = ["openai>=1.40"]
agent = ["torch>=2.1", "transformers>=4.56", "anthropic>=2.6", "openai>=1.40", "tokenizers>=0.15"]
all = [
  "tokenizers>=0.15", "torch>=2.1", "transformers>=4.56", "huggingface_hub>=0.20",
  "mcp>=2.3", "anthropic>=2.6", "openai>=1.40",
]
# torch is installed separately in CI (CPU wheels); tests that need it skip without it.
dev = [
  "pytest>=8", "ruff>=0.6", "mypy>=1.10", "tokenizers>=0.15", "mcp>=2.3", "anyio>=4",
  "transformers>=4.56", "anthropic>=2.6", "openai>=1.40", "huggingface_hub>=0.20",
]

[project.scripts]
weightspec = "weightspec.cli:main"

[project.urls]
Homepage = "https://github.com/namashworks/weightspec"
Documentation = "https://github.com/namashworks/weightspec#readme"
Issues = "https://github.com/namashworks/weightspec/issues"

[tool.hatch.version]
path = "src/weightspec/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/weightspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to the Hugging Face Hub"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false  # numpy returns Any
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
